<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Calico</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span>Radio</span>
      <img src="logo.png" alt="Radio Calico logo" />
      <span>Calico</span>
    </a>
  </header>

  <main>
    <section class="now-playing" id="nowPlaying">
      <div class="cover">
        <div class="placeholder"><img src="logo.png" alt="" /></div>
        <img id="coverImg" class="loading" alt="Album cover" />
        <span class="badge" id="badge" hidden>New</span>
      </div>

      <div class="details">
        <div class="eyebrow"><span class="live-dot"></span> Live now</div>
        <h1 class="track-artist" id="artist">Radio Calico</h1>
        <p class="track-title" id="title">Tuning in…</p>
        <p class="track-album" id="album"></p>

        <div class="quality">
          <div>Source quality: <strong id="sourceQuality">—</strong></div>
          <div>Stream quality: <strong>48kHz FLAC / HLS Lossless</strong></div>
        </div>

        <div class="player">
          <button class="play-btn" id="playBtn" disabled aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            <span class="spinner"></span>
          </button>
          <div class="player-info">
            <div class="status" id="status">Connecting to stream…</div>
            <div class="volume-row">
              <button class="icon-btn" id="muteBtn" aria-label="Mute">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 5 6 9H3v6h3l5 4V5z"/>
                  <path id="volWave1" d="M15.5 8.5a5 5 0 0 1 0 7"/>
                  <path id="volWave2" d="M18.5 5.5a9 9 0 0 1 0 13"/>
                  <path id="volMuted" d="m16 9 6 6m0-6-6 6" style="display:none"/>
                </svg>
              </button>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <section class="history">
    <div class="history-inner">
      <h2>Previous tracks</h2>
      <ol id="history"><li class="empty">Loading…</li></ol>
    </div>
  </section>

  <footer>Ad-free, data-free, subscription-free. Kick back and enjoy.</footer>

  <audio id="audio" preload="none"></audio>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
