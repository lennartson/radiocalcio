<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Calico</title>
  <link rel="icon" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mint: #D8F2D5;
      --forest: #1F4E23;
      --teal: #38A29D;
      --orange: #EFA63C;
      --charcoal: #231F20;
      --cream: #F5EADA;
      --white: #FFFFFF;
      --heading: "Montserrat", "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --body: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--body);
      font-size: 1rem;
      line-height: 1.6;
      color: var(--charcoal);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .site-header {
      background: var(--teal);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--heading);
      font-weight: 700;
      font-size: 1.75rem;
      color: var(--white);
      text-decoration: none;
      letter-spacing: 0.01em;
    }
    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--mint);
    }

    /* Now playing */
    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }
    .now-playing {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 3rem;
      align-items: center;
    }

    .cover {
      position: relative;
      aspect-ratio: 1;
      width: 100%;
      max-width: 520px;
      justify-self: end;
      border-radius: 8px;
      overflow: hidden;
      background: var(--cream);
      box-shadow: 0 16px 40px rgba(35, 31, 32, 0.18);
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.4s ease;
    }
    .cover img.loading { opacity: 0; }
    .cover .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
    }
    .cover .placeholder img { width: 40%; height: auto; opacity: 0.5; }
    .badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: var(--orange);
      color: var(--charcoal);
      font-family: var(--heading);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--heading);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--teal);
      margin-bottom: 1rem;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #bbb;
    }
    .is-playing .live-dot {
      background: #d64545;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(214, 69, 69, 0); }
    }

    .track-artist {
      font-family: var(--heading);
      font-weight: 700;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      color: var(--forest);
      margin: 0;
    }
    .track-title {
      font-family: var(--heading);
      font-weight: 600;
      font-size: clamp(1.4rem, 2.6vw, 2rem);
      line-height: 1.3;
      margin: 0.5rem 0 0;
    }
    .track-album {
      font-family: var(--heading);
      font-weight: 500;
      font-size: 1.1rem;
      color: #5a5556;
      margin: 0.5rem 0 0;
    }
    .quality {
      margin-top: 1.5rem;
      font-size: 0.875rem;
      line-height: 1.5;
      color: #5a5556;
    }
    .quality strong { color: var(--charcoal); font-weight: 600; }

    /* Player bar */
    .player {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--cream);
      border-radius: 999px;
      padding: 0.5rem 1.5rem 0.5rem 0.5rem;
      max-width: 420px;
    }
    .play-btn {
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: var(--forest);
      color: var(--white);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .play-btn:hover:not(:disabled) { background: var(--teal); }
    .play-btn:active:not(:disabled) { transform: scale(0.95); }
    .play-btn:disabled { background: #9aa59b; cursor: default; }
    .play-btn:focus-visible,
    .icon-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(56, 162, 157, 0.4);
    }
    .play-btn svg { width: 24px; height: 24px; }
    .play-btn .icon-pause, .play-btn .spinner { display: none; }
    .is-playing .play-btn .icon-play { display: none; }
    .is-playing .play-btn .icon-pause { display: block; }
    .is-loading .play-btn .icon-play,
    .is-loading .play-btn .icon-pause { display: none; }
    .is-loading .play-btn .spinner { display: block; }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .player-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .status {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--charcoal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .icon-btn {
      flex: none;
      width: 40px;
      height: 40px;
      margin-left: -8px;
      border: none;
      background: transparent;
      color: var(--charcoal);
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(35, 31, 32, 0.06); }
    .icon-btn svg { width: 20px; height: 20px; }

    input[type="range"] {
      --fill: 100%;
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 6px;
      border-radius: 3px;
      background: linear-gradient(to right, var(--teal) var(--fill), rgba(35, 31, 32, 0.15) var(--fill));
      cursor: pointer;
    }
    input[type="range"]:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(56, 162, 157, 0.3);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--white);
      border: 2px solid var(--teal);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--white);
      border: 2px solid var(--teal);
    }

    /* Previous tracks */
    .history {
      background: var(--mint);
      padding: 3rem 1.5rem 4rem;
    }
    .history-inner {
      max-width: 640px;
      margin: 0 auto;
    }
    .history h2 {
      font-family: var(--heading);
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--forest);
      margin: 0 0 1rem;
    }
    .history ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .history li {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(31, 78, 35, 0.12);
    }
    .history li:last-child { border-bottom: none; }
    .history .num {
      flex: none;
      width: 1.5rem;
      font-family: var(--heading);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--teal);
    }
    .history .artist { font-weight: 600; }
    .history .title { font-style: italic; color: #4a4546; }
    .history .empty { color: #5a5556; font-style: italic; }

    footer {
      background: var(--forest);
      color: var(--mint);
      text-align: center;
      font-size: 0.875rem;
      padding: 1rem;
    }

    @media (max-width: 760px) {
      main { padding: 2rem 1.25rem 3rem; }
      .now-playing { grid-template-columns: 1fr; gap: 2rem; }
      .cover { justify-self: center; max-width: 420px; }
      .details { text-align: center; }
      .player { margin-left: auto; margin-right: auto; }
      .player-info { text-align: left; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span>Radio</span>
      <img src="logo.png" alt="Radio Calico logo" />
      <span>Calico</span>
    </a>
  </header>

  <main>
    <section class="now-playing" id="nowPlaying">
      <div class="cover">
        <div class="placeholder"><img src="logo.png" alt="" /></div>
        <img id="coverImg" class="loading" alt="Album cover" />
        <span class="badge" id="badge" hidden>New</span>
      </div>

      <div class="details">
        <div class="eyebrow"><span class="live-dot"></span> Live now</div>
        <h1 class="track-artist" id="artist">Radio Calico</h1>
        <p class="track-title" id="title">Tuning in…</p>
        <p class="track-album" id="album"></p>

        <div class="quality">
          <div>Source quality: <strong id="sourceQuality">—</strong></div>
          <div>Stream quality: <strong>48kHz FLAC / HLS Lossless</strong></div>
        </div>

        <div class="player">
          <button class="play-btn" id="playBtn" disabled aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            <span class="spinner"></span>
          </button>
          <div class="player-info">
            <div class="status" id="status">Connecting to stream…</div>
            <div class="volume-row">
              <button class="icon-btn" id="muteBtn" aria-label="Mute">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 5 6 9H3v6h3l5 4V5z"/>
                  <path id="volWave1" d="M15.5 8.5a5 5 0 0 1 0 7"/>
                  <path id="volWave2" d="M18.5 5.5a9 9 0 0 1 0 13"/>
                  <path id="volMuted" d="m16 9 6 6m0-6-6 6" style="display:none"/>
                </svg>
              </button>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <section class="history">
    <div class="history-inner">
      <h2>Previous tracks</h2>
      <ol id="history"><li class="empty">Loading…</li></ol>
    </div>
  </section>

  <footer>Ad-free, data-free, subscription-free. Kick back and enjoy.</footer>

  <audio id="audio" preload="none"></audio>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
  <script>
    const STREAM_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    const METADATA_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/metadatav2.json';
    const COVER_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/cover.jpg';

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const statusEl = document.getElementById('status');
    const volumeEl = document.getElementById('volume');
    const muteBtn = document.getElementById('muteBtn');
    const nowPlaying = document.getElementById('nowPlaying');

    let isPlaying = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setLoading(loading) {
      nowPlaying.classList.toggle('is-loading', loading);
    }

    function setReady() {
      playBtn.disabled = false;
      setStatus('Ready to play');
    }

    function setupNativeHls() {
      audio.src = STREAM_URL;
      setReady();
    }

    function setupHlsJs() {
      const hls = new Hls({
        // Sit further behind the live edge and keep more audio buffered so
        // brief network dips don't stall playback.
        liveSyncDurationCount: 4,
        liveMaxLatencyDurationCount: 6,
        maxBufferLength: 30,
        backBufferLength: 30,
        fragLoadingMaxRetry: 6,
        manifestLoadingMaxRetry: 6,
        levelLoadingMaxRetry: 6,
      });
      hls.loadSource(STREAM_URL);
      hls.attachMedia(audio);

      // The manifest under-reports the FLAC bitrate (~140 kbps declared vs
      // ~700 kbps actual), so ABR never steps down from it. Track the AAC
      // level and fall back to it if FLAC stalls.
      let aacLevel = -1;
      let stalls = 0;
      hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
        aacLevel = data.levels.findIndex((l) => /mp4a/.test(l.audioCodec || l.attrs.CODECS || ''));
        setReady();
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
          stalls += 1;
          if (stalls >= 2 && aacLevel !== -1 && hls.currentLevel !== aacLevel) {
            hls.currentLevel = aacLevel;
            setStatus('Switched to AAC for smoother playback');
          }
        }
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          setStatus('Reconnecting…');
          hls.startLoad();
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          setLoading(false);
          setStatus('Stream error: ' + data.type);
        }
      });
    }

    // Prefer hls.js (MSE) for its buffering/recovery control; only use
    // native HLS where MSE isn't available (e.g. iOS Safari).
    if (window.Hls && Hls.isSupported()) {
      setupHlsJs();
    } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
      setupNativeHls();
    } else {
      setStatus('HLS playback is not supported in this browser.');
    }

    playBtn.addEventListener('click', () => {
      if (!isPlaying) {
        setLoading(true);
        audio.play().catch((err) => {
          setLoading(false);
          setStatus('Playback failed: ' + err.message);
        });
      } else {
        audio.pause();
      }
    });

    audio.addEventListener('playing', () => {
      isPlaying = true;
      setLoading(false);
      nowPlaying.classList.add('is-playing');
      playBtn.setAttribute('aria-label', 'Pause');
      setStatus('Playing live');
    });

    audio.addEventListener('pause', () => {
      isPlaying = false;
      setLoading(false);
      nowPlaying.classList.remove('is-playing');
      playBtn.setAttribute('aria-label', 'Play');
      setStatus('Paused');
    });

    audio.addEventListener('waiting', () => {
      setLoading(true);
      setStatus('Buffering…');
    });

    audio.addEventListener('error', () => {
      setLoading(false);
      setStatus('Playback error. Try again.');
    });

    // Volume
    function renderVolume() {
      const level = audio.muted ? 0 : audio.volume;
      volumeEl.style.setProperty('--fill', level * 100 + '%');
      document.getElementById('volMuted').style.display = level === 0 ? '' : 'none';
      document.getElementById('volWave1').style.display = level > 0 ? '' : 'none';
      document.getElementById('volWave2').style.display = level > 0.5 ? '' : 'none';
      muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute' : 'Mute');
    }

    volumeEl.addEventListener('input', () => {
      audio.volume = Number(volumeEl.value);
      audio.muted = audio.volume === 0;
      renderVolume();
    });

    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      if (!audio.muted && audio.volume === 0) {
        audio.volume = 0.5;
        volumeEl.value = 0.5;
      }
      volumeEl.value = audio.muted ? 0 : audio.volume;
      renderVolume();
    });

    renderVolume();

    // Track metadata
    const artistEl = document.getElementById('artist');
    const titleEl = document.getElementById('title');
    const albumEl = document.getElementById('album');
    const coverImg = document.getElementById('coverImg');
    const badgeEl = document.getElementById('badge');
    const historyEl = document.getElementById('history');
    let currentTrackKey = null;

    coverImg.addEventListener('load', () => coverImg.classList.remove('loading'));
    coverImg.addEventListener('error', () => coverImg.classList.add('loading'));

    function formatQuality(meta) {
      if (!meta.bit_depth || !meta.sample_rate) return '—';
      return `${meta.bit_depth}-bit ${meta.sample_rate / 1000}kHz`;
    }

    function renderHistory(meta) {
      historyEl.replaceChildren();
      for (let i = 1; i <= 5; i++) {
        const artist = meta[`prev_artist_${i}`];
        const title = meta[`prev_title_${i}`];
        if (!artist && !title) continue;
        const li = document.createElement('li');
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = i;
        const text = document.createElement('span');
        const a = document.createElement('span');
        a.className = 'artist';
        a.textContent = artist;
        const t = document.createElement('span');
        t.className = 'title';
        t.textContent = title;
        text.append(a, ' — ', t);
        li.append(num, text);
        historyEl.append(li);
      }
      if (!historyEl.children.length) {
        historyEl.innerHTML = '<li class="empty">No previous tracks yet.</li>';
      }
    }

    async function refreshMetadata() {
      try {
        const res = await fetch(METADATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const meta = await res.json();

        const key = `${meta.artist}|${meta.title}`;
        if (key !== currentTrackKey) {
          currentTrackKey = key;
          artistEl.textContent = meta.artist || 'Radio Calico';
          titleEl.textContent = meta.title ? meta.title + (meta.date ? ` (${meta.date})` : '') : '';
          albumEl.textContent = meta.album || '';
          document.title = meta.title ? `${meta.artist} – ${meta.title} · Radio Calico` : 'Radio Calico';
          coverImg.classList.add('loading');
          coverImg.src = COVER_URL + '?t=' + Date.now();
        }

        badgeEl.hidden = !meta.is_new;
        document.getElementById('sourceQuality').textContent = formatQuality(meta);
        renderHistory(meta);
      } catch {
        // Metadata is best-effort; keep showing the last known track.
      }
    }

    refreshMetadata();
    setInterval(refreshMetadata, 15000);
  </script>
</body>
</html>
