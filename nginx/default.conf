server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vendored hls.js and fonts are served from the node_modules copy by the backend, so
  # nginx serves them too. Copied into the image at build time (see Dockerfile.nginx).
  location /vendor/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Static player: the HTML itself should always be fresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API requests go to the Node backend.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
