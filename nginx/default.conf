server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses. Images and fonts are already compressed, so they're left out.
  # Responses under 1 KB aren't worth the CPU.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # Vendored hls.js and the fonts are copied into this image at build time (see Dockerfile.nginx).
  location /vendor/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # Static player: the HTML itself should always be fresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API requests go to the Node backend.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
