name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: radiocalico
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/radiocalico
      DATABASE_URL: postgres://postgres:test@localhost:5432/radiocalico
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Server and checks share one step: background processes don't survive past their step.
      - name: Start server and check it
        run: |
          npm start &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && break
            if [ "$i" = 20 ]; then
              echo "Server did not respond on /api/health" >&2
              exit 1
            fi
            sleep 0.5
          done
          echo
          curl -fsS http://localhost:3000/ | grep -q 'style.css'
          curl -fsS http://localhost:3000/ | grep -q 'app.js'
          curl -fsS -o /dev/null http://localhost:3000/style.css
          curl -fsS -o /dev/null http://localhost:3000/app.js
